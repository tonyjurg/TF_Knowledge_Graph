<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title | default: "TF Knowledge Graph" }}</title>
    <style>
      body {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      code {
        word-break: break-word;
      }
    </style>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const renderMermaidBlocks = () => {
        const mermaidCodeBlocks = document.querySelectorAll("pre code.language-mermaid");

        mermaidCodeBlocks.forEach((codeBlock) => {
          const pre = codeBlock.closest("pre");
          if (!pre) return;

          const mermaidDiv = document.createElement("div");
          mermaidDiv.className = "mermaid";
          mermaidDiv.textContent = codeBlock.textContent || "";
          pre.replaceWith(mermaidDiv);
        });
      };

      document.addEventListener("DOMContentLoaded", async () => {
        renderMermaidBlocks();
        mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
        await mermaid.run({ querySelector: ".mermaid" });
      });
    </script>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
